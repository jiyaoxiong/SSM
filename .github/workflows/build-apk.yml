name: Build C16 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply v2.6 UI patch
        run: python3 scripts/v26_patch.py
      - name: Apply v2.7 loading fix
        run: python3 scripts/v27_patch.py
      - name: Apply v2.8 UX patch
        run: python3 scripts/v28_patch.py
      - name: Apply v2.9 login fix
        run: python3 scripts/v29_patch.py
      - name: Apply v3.0 account data patch
        run: python3 scripts/v30_patch.py
      - name: Apply v3.1 API diagnostics
        run: python3 scripts/v31_patch.py
      - name: Apply v3.2 vehicle UI and smart categories
        run: python3 scripts/v32_patch.py
      - name: Apply v3.3 player recommendation patch
        run: python3 scripts/v33_patch.py
      - name: Apply v3.5 driving UI and smart recommendation patch
        run: python3 scripts/v35_patch.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk C16YouTube-v3.5-gallery3d.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: C16YouTube-v3.5-gallery3d-apk
          path: C16YouTube-v3.5-gallery3d.apk
          retention-days: 30
