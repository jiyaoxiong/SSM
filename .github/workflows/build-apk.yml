name: Build C16 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply v4.3 compile fix
        run: python3 scripts/v43_compile_fix.py

      - name: Apply v4.4 account and library upgrade
        run: python3 scripts/v44_patch.py

      - name: Apply v4.5 YouTube account data sync
        run: python3 scripts/v45_patch.py

      - name: Apply v4.6 player reliability and fullscreen
        run: python3 scripts/v46_patch.py

      - name: Apply v4.7 IFrame API and player identity upgrade
        run: python3 scripts/v47_patch.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk C16YouTube-v4.7-gallery3d.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: C16YouTube-v4.7-gallery3d-apk
          path: C16YouTube-v4.7-gallery3d.apk
          retention-days: 30
